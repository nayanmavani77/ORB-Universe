# ===========================================================================
#  Range Breakout EA — configuration
#
#  Read top to bottom. Seven numbered sections:
#
#    1  CLOCK       what time zone the session times are written in
#    2  SESSIONS    WHICH windows to trade, and which are ON or OFF
#    3  DEFAULTS    HOW to trade — shared by every session
#    4  NEWS DAYS   which calendar dates to avoid or target
#    5  INSTRUMENT  contract details used for price rounding and P&L
#    6  DATA        where the bars come from
#    7  BACKTEST    account size and fill assumptions
#
#  The two you will touch most are 2 and 3.
#
#    Section 2 answers "when do I trade?"   -> one entry per session
#    Section 3 answers "how do I trade?"    -> one shared rule set
#
#  Every option in section 3 can be repeated inside a session to override it
#  just for that session. Nothing else in the file is per-session.
#
#  Every option is also settable from the terminal — see docs/CLI.md.
# ===========================================================================


# ===========================================================================
# 1  CLOCK
# ===========================================================================
# Every time in this file is BROKER / SERVER time — the same clock the EA
# reads. Databento timestamps are UTC, so this is how the two line up.
#
# Name a zone (DST-aware) or give a fixed offset. Naming the zone is safer:
# a fixed offset drifts by an hour for ~5 months a year, because 13:30 UTC is
# 09:30 in New York during EDT but 08:30 during EST.
server_timezone: "America/New_York"     # set to null to use the offset below
server_utc_offset_hours: 0              # ignored while server_timezone is set


# ===========================================================================
# 2  SESSIONS  —  WHEN to trade
# ===========================================================================
# One entry per session. Each runs the SAME strategy rules on its own window.
#
#   enabled: true / false
#       The ON/OFF switch. A disabled session is never built — it takes no
#       trade and costs nothing. Run 1, 2 or all 3.
#
#   range_start / range_end
#       The opening range. Its high and low become the breakout levels.
#
#   stop_time
#       No new entries after this, and any open trade is closed (see
#       close_at_stop_time in section 3).
#
# These three times are REQUIRED in every session and are never inherited, so
# a session's window is always visible right here.
#
# RULE: enabled sessions must NOT overlap. Each has to be flat at its own
# stop_time before the next one opens, so two sessions can never compete for
# the single account position. The config is rejected at load time if two
# enabled windows share any part of the clock.
#
# To give one session its own rules, repeat any section-3 option inside it —
# see the commented lines under `asia` below.
#
# From the terminal:
#   --sessions asia,new_york            run exactly these, switch off the rest
#   --set sessions.asia.risk_reward=3   change one session's setting
sessions:

  asia:
    enabled: true
    range_start: "19:00"          # Asia open
    range_end:   "19:30"
    stop_time:   "02:55"          # flat before London opens
    # --- optional per-session overrides (uncomment to use) ---
    # signal_timeframe: "M1"
    # risk_reward: 1.5
    # sl_mode: full_range
    # lots: 2.0
    risk_reward: 2.0
    signal_timeframe: "M1"
    news_mode: "off"

    #
    # News filter for THIS session only. One line switches the whole thing:
    #   news_mode: "off"    skip every news date listed in section 4
    #   news_mode: "on"     trade straight through them
    #   news_mode: "only"   trade nothing except those dates
    # So "skip news in Asia but trade it in New York" is one line in each.
    # news_mode: "off"
    #
    # Or override single categories. Dates are always inherited from section 4
    # — you only restate what differs:
    # news:
    #   federal_funds_rate: { mode: "off" }   # sit out FOMC in this session
    #   core_cpi_mm:        { mode: "on"  }   # but trade CPI

  london:
    enabled: false
    range_start: "03:00"          # London open
    range_end:   "03:30"
    stop_time:   "09:25"          # flat before New York opens

  new_york:
    enabled: true
    range_start: "09:30"          # New York open
    range_end:   "09:45"
    stop_time:   "16:55"
    risk_reward: 4.5
    signal_timeframe: "M15"
    news_mode: "on"

                                  # flat before the 17:00 COMEX halt
                                  # NOT 17:00 — that is the exact moment COMEX
                                  # halts, so no tick arrives to trigger the
                                  # close and the position rides the 17:00-18:00
                                  # break (and the whole weekend on a Friday).




# ===========================================================================
# 3  DEFAULTS  —  HOW to trade
# ===========================================================================
# The shared rule set. Every session inherits all of it, and any session may
# override any single option by repeating it in section 2.
#
# These are a 1:1 mirror of the MQL5 inputs — the strategy rules themselves are
# unchanged; this only says which values they run with.
defaults:

  # --- signal ---
  signal_timeframe: "M5"          # InpSignalTF — M1 M5 M15 M30 H1 H4 D1
                                  # the bar that must CLOSE beyond the range

  # --- risk ---
  sl_mode: mid_range              # InpSLMode: mid_range | full_range
                                  #   mid_range  — stop at the range midpoint
                                  #   full_range — stop at the opposite side
  risk_reward: 2.0                # InpRR — target = this x the stop distance
  lots: 1.0                       # InpLots

  # --- entries ---
  require_range_reentry: true     # InpRequireRangeReentry
                                  # true  — after a trade closes, price must
                                  #         close back INSIDE the range before
                                  #         the next breakout is taken
                                  # false — the very next candle closing
                                  #         outside the range opens a new trade
  max_trades_per_session: 0       # InpMaxTradesPerSession (0 = unlimited)
  close_at_stop_time: true        # InpCloseAtStopTime — flatten at stop_time.
                                  # Required when more than one session is on.

  # --- journal ---
  log_level: normal               # none | normal | verbose
  log_file: null                  # e.g. "backtest_out/journal.log"
  log_show_time: true             # prefix each line with server time

  # --- identification ---
  magic: 20260814                 # InpMagic — tags this EA's orders in MT5
  comment: "RangeBreak"           # InpComment — order comment


# ===========================================================================
# 4  NEWS DAYS
# ===========================================================================
# Calendar dates to avoid, or to trade exclusively.
#
# This is the SHARED news calendar — every session inherits it. A session can
# then treat it differently without repeating a single date (see section 2):
#
#   sessions:
#     asia:     { news_mode: "off" }   # skip these dates
#     new_york: { news_mode: "on"  }   # trade through them
#
# A session may also override one category at a time. Dates are always
# inherited; only the mode you restate changes.
#
# Each category has its own dates and its own mode:
#   on    - no restriction from this category (its dates are ignored)
#   off   - never trade this category's dates
#   only  - trade this category's dates and nothing else
#
# Matching is by CALENDAR DATE, never by day of the week. Listing 2026.01.13
# affects that one date only, not every Tuesday.
#
# Dates: single dates and from-to ranges, one per line or comma separated:
#   dates: |
#     2026.01.13
#     2026.03.10-2026.03.12
#
# HOW CATEGORIES COMBINE (only matters when you mix modes):
#   1. OFF IS FINAL. A day listed by ANY off category is never traded — full
#      stop. It does not matter if that same date also appears in an on
#      category, in an only category, or in the general bucket below. One off
#      listing ends the decision for that day.
#   2. If ANY category is set to only, a day must be listed by at least one of
#      them to be tradeable.
#   3. Otherwise the day is tradeable.
# A category with no dates can never match, so it restricts nothing.
news:

  core_cpi_mm:
    mode: "on"
    dates: |
      2026-01-13
      2026-02-13
      2026-03-11
      2026-04-10
      2026-05-12
      2026-06-10
      2026-07-14
      2026-08-12

  unemployment_rate:
