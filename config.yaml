# An extra un-categorised bucket. Behaves exactly like a ninth category:
# put any dates here and set news_trading to on / off / only.
news_days: ""
news_trading: "off"


# ===========================================================================
# 5  INSTRUMENT
# ===========================================================================
# Contract details used for price rounding and P&L maths.
# In LIVE mode these are read from MT5 and override whatever is written here.
symbol:
  name: "GC"                      # COMEX gold, 100 troy oz
  digits: 2
  point: 0.01
  tick_size: 0.1                 # GC minimum tick
  stops_level_points: 0           # SYMBOL_TRADE_STOPS_LEVEL
  volume_min: 1.0
  volume_max: 100.0
  volume_step: 1.0
  value_per_price_unit: 100.0     # money per 1.0 of price move per 1 lot
                                  #   GC 100  ($10 per 0.10 tick)
                                  #   ES 50 | NQ 20 | CL 1000
                                  #   EURUSD 1 standard lot = 100000
  currency: "USD"


# ===========================================================================
# 6  DATA
# ===========================================================================
databento:
  api_key: null                   # or set the DATABENTO_API_KEY env variable
  dataset: "GLBX.MDP3"
  symbols: "GC.FUT"
  stype_in: "parent"              # raw_symbol | continuous | parent | instrument_id
  schema: "ohlcv-1m"              # base bar resolution fed to the engine

  # --- which contract to trade inside a multi-contract file ---
  # A parent file holds EVERY contract month plus every calendar spread.
  #   front_month_volume : per trading day, the highest-volume outright
  #                        contract; the roll only ever moves forward  <- default
  #   symbol             : one fixed contract, set contract_symbol below
  #   all                : no selection (single-instrument files only)
  contract_mode: "front_month_volume"
  contract_symbol: null           # e.g. "GCZ6" when contract_mode is "symbol"
  include_spreads: false          # keep GCG6-GCJ6 style spreads (you don't want to)
  roll_min_volume: 0              # ignore thin contracts when rolling

  # Hour (server time) the futures trading day starts on — the ONLY instant the
  # contract is allowed to change. 18 = the CME 18:00 New York open, so the
  # switch lands BETWEEN sessions. Setting this to 0 rolls at midnight, which
  # cuts through any session spanning midnight and injects the whole calendar
  # spread (+$33..+$60 on gold) as a price move that never happened.
  roll_boundary_hour: 18

  # --- used by download_data.py only ---
  start: "2024-01-01"
  end:   "2025-01-01"
  output_dir: "data"


# ===========================================================================
# 7  BACKTEST
# ===========================================================================
backtest:
  # The single merged bar file built by tools/merge_data.py.
  # Rebuild it after adding new data with:
  #   python tools/merge_data.py -d "data/gc_ohlcv1m_parent_*.dbn.zst" \
  #                              -o data/gc_1m_merged.parquet
  #
  # Do NOT point this at the "data" DIRECTORY: that would load the raw
  # .dbn.zst files AND the merged .parquet built from them — the same bars
  # twice. Name the file, or use an explicit glob.
  dbn_paths: "data/gc_1m_merged.parquet"

  initial_balance: 100000.0

  # --- fill assumptions ---
  # All three default to 0, so reported P&L is GROSS — no spread, slippage or
  # commission. Set them if you want net figures.
  spread_points: 0.0              # extra points paid on entry (ask - bid)
  slippage_points: 0.0            # applied against you on entry and on stops
  commission_per_lot_per_side: 0.0
  pessimistic_intrabar: true      # if SL and TP are both inside one bar, SL wins

  # --- output ---
  out_dir: "backtest_out"
  report_name: "orb_backtest_report"


# ===========================================================================
#  MetaTrader 5  (live execution only — ignored by the backtester)
# ===========================================================================
mt5:
  symbol: "GC"                    # the symbol name inside your MT5 terminal
  login: null
  password: null
  server: null
  terminal_path: null             # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe"
  deviation_points: 0            # max slippage allowed on a market order
  dry_run: false                   # true = log the order, do NOT send it
