      2026-02-11
      2026-03-06
      2026-04-03
      2026-05-08
      2026-06-05
      2026-07-02
      2026-08-07

  ism_manufacturing_pmi:
    mode: "on"
    dates: |
      2026-01-05
      2026-02-02
      2026-03-02
      2026-04-01
      2026-05-01
      2026-06-01
      2026-07-01
      2026-08-03

  core_pce_price_index_mm:
    mode: "on"
    dates: |
      2026-01-22
      2026-02-20
      2026-03-13
      2026-04-09
      2026-04-30
      2026-05-28
      2026-06-25
      2026-07-30

  federal_funds_rate:
    mode: "on"
    dates: |
      2026-01-28
      2026-03-18
      2026-04-29
      2026-06-17
      2026-07-29

  core_ppi_mm:
    mode: "on"
    dates: |
      2026-01-14
      2026-01-30
      2026-02-27
      2026-03-18
      2026-04-14
      2026-05-13
      2026-06-11
      2026-07-15
      2026-08-13

  ism_services_pmi:
    mode: "on"
    dates: |
      2026-01-07
