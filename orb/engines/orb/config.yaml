# ===========================================================================
#  ENGINE: orb
#  the opening-range breakout — the original strategy
#
#  THIS FILE IS THE COMPLETE CONFIGURATION FOR THIS ENGINE.
#  There is no parent config. Instrument, data, account, fill assumptions,
#  news dates, sessions and the sweep grid are all here. Open this one file
#  and you can see everything a run of this engine will use.
#
#      python tools/backtest.py --engine orb      one backtest
#      python tools/sweep.py    --engine orb      the whole sweep
#
#  Running engines TOGETHER
#  ------------------------
#  Name several and their sessions merge onto one account:
#
#      python tools/backtest.py --engine orb,orb_reverse
#      python run_live.py       --engine orb,orb_reverse
#
#  Each session runs the engine of the file it is written in, so nothing has
#  to be restated. The shared blocks below — INSTRUMENT, DATA, BACKTEST, MT5
#  and the CLOCK — must MATCH in every engine config taking part, because a
#  run has one account, one instrument and one data feed. A mismatch is
#  reported with the field and both values rather than silently resolved.
#
#  Sections
#  --------
#    ENGINE      which engine this file drives (must match the folder name)
#    CLOCK       what time zone the session times are written in
#    SESSIONS    WHICH windows to trade, and which are ON or OFF
#    DEFAULTS    HOW to trade — shared by every session in this file
#    NEWS DAYS   which calendar dates to avoid or target
#    INSTRUMENT / DATA / BACKTEST / MT5   the shared blocks
#    PERIOD      backtest dates and where output goes
#    SWEEP       the lists tools/sweep.py combines
# ===========================================================================


# ===========================================================================
# 0  ENGINE
# ===========================================================================
# Every session below runs this engine unless the session names another.
# That per-session override is how one file drives a mixed run.
engine: orb


# ===========================================================================
# 1  CLOCK
# ===========================================================================
# Every time in this file is BROKER / SERVER time — the same clock the EA
# reads. Databento timestamps are UTC, so this is how the two line up.
#
# Name a zone (DST-aware) or give a fixed offset. Naming the zone is safer:
# a fixed offset drifts by an hour for ~5 months a year, because 13:30 UTC is
# 09:30 in New York during EDT but 08:30 during EST.
server_timezone: "America/New_York"     # set to null to use the offset below
server_utc_offset_hours: 0              # ignored while server_timezone is set

# ===========================================================================
# 1b  INSTRUMENTS  —  WHAT to trade
# ===========================================================================
# One entry per tradeable instrument. Four lines each:
#
#   signal          the Databento parent symbol the SIGNAL is built from
#   mt5             the symbol in YOUR terminal the ORDER is sent to
#   value_per_point money per 1.0 of price movement, per 1.0 lot
#   data            bar files for the backtest
#
# `signal` and `mt5` are deliberately separate. The strategy reads CME futures
# and the order goes to a CFD, and the two quote tens of dollars apart —
# XAUUSD sits about $56 below GC. `translate_levels` (default true) carries the
# SL and TP across as DISTANCES from the real fill, never as absolute levels.
#
# Every session below names one with `instrument:`. Sessions on DIFFERENT
# instruments MAY share a clock window — GC New York and ES New York are the
# same hours by definition — and each instrument holds its own position, on one
# shared account balance. Two sessions on the SAME instrument still may not
# overlap: they would fight over one position slot.
#
# Everything else — digits, tick size, volume limits — is read from MT5 when
# live and overrides whatever is set here, so adding an instrument really is
# just these four lines.
#
# From the terminal:
#   --instruments gc,es       trade only these this run
#   python tools\mt5_check.py --deals    check the mapping reaches the terminal
instruments:

  # `value_per_point` and the `volume_*` rules were read from the terminal with
  #   python tools\mt5_check.py --suggest XAUUSDm,US500m,USTECm
  # Re-run that if you change broker or account type: how much a point pays and
  # what lot sizes are legal are the BROKER's, not the exchange's.
  #
  # Note what is deliberately NOT copied from the terminal: `digits`, `point`
  # and `tick_size`. Those describe how PRICES are rounded, and the backtest
  # prices CME futures, not the broker's CFD. XAUUSDm quotes 3 decimals while
  # GC futures quote 2 — copying the 3 in moves every stop by a tenth of a cent
  # and the backtest stops matching the recorded results. Live reads all three
  # from MT5 at start-up regardless, so setting them here buys nothing.

  gc:
    signal: "GC.FUT"              # CME gold futures — where the signal comes from
    mt5:    "XAUUSDm"             # the symbol in your terminal — where it trades
    value_per_point: 100.0        # 1 lot = 100 oz, so $100 per $1 move
    data:   ["data/gc_1m_merged.parquet"]
    volume_min:  0.01
    volume_step: 0.01
    volume_max:  200

  es:
    signal: "ES.FUT"              # CME E-mini S&P 500
    mt5:    "US500m"
    value_per_point: 1.0          # this broker's CFD is $1/point, NOT the
                                  # CME contract's $50 — see the note below
    data:   ["data/es_1m.parquet"]
    volume_min:  0.14             # an unusual minimum: the backtest needs it
    volume_step: 0.01             # or it sizes trades MT5 would round up
    volume_max:  1000

  nq:
    signal: "NQ.FUT"              # CME E-mini Nasdaq 100
    mt5:    "USTECm"
    value_per_point: 1.0          # again the broker's CFD, not NQ's $20
    data:   ["data/nq_1m.parquet"]
    volume_min:  0.05
    volume_step: 0.01
    volume_max:  500

  # WHY THE INDEX FIGURES LOOK SMALL
  # The signal comes from CME futures; the order goes to a broker CFD. Both are
  # quoted in the same index points, so the number of points a trade wins is the
  # same on either. But the MONEY per point is the broker's contract, and this
  # broker pays $1 per point where the CME contract pays $50 (ES) or $20 (NQ).
  #
  # That makes risk wildly uneven at equal lot sizes. Measured on 187 real New
  # York gold trades, Jan-Aug 2026:
  #
  #     XAUUSDm   ~15.1 stop x 100/pt  =  $1,510 risk at 1.00 lot
  #     USTECm    ~138  stop x   1/pt  =  $  138 risk at 1.00 lot
  #     US500m    ~ 38  stop x   1/pt  =  $   38 risk at 1.00 lot
  #
  # Gold risks 40x what US500m does per lot. Left equal, gold would be ~97% of
  # the P&L and the indices pure noise. So each session sets its own `lots:`
  # (section 2) to put roughly the same money at risk on every instrument.

# ===========================================================================
# 2  SESSIONS  —  WHEN to trade
# ===========================================================================
# One entry per window. `enabled` switches each on or off. Enabled windows may
# not overlap: there is one account and one position at a time, and the config
# is rejected at load if two enabled windows share any part of the clock.
#
# Any DEFAULTS option (section 3) can be repeated inside a session to override
# it there. `engine:` can be too — that is how a session in this file runs a
# different strategy, e.g. to trade Asia with orb_reverse from here.
#
# From the terminal:
#   --sessions asia,new_york            run exactly these, switch off the rest
#   --set sessions.asia.risk_reward=3   change one session's setting
sessions:

  # ------------------------------------------------------------------------
  # A session is a WINDOW. Under it, `instruments:` lists which symbols trade
  # that window — the (session x instrument) matrix.
  #
  #   * the ROW holds what the window shares: times, and any setting every
  #     symbol in it should use
  #   * each CELL holds what that ONE symbol does differently, and switches
  #     on and off by itself
  #   * a cell inherits DEFAULTS -> ROW -> its own lines, in that order
  #
  # So one session can run three symbols on different settings, the same symbol
  # can run in three sessions on different settings, and any single combination
  # can be switched off without touching its neighbours.
  #
  # Each cell becomes one ordinary session named `<session>_<instrument>` —
  # `new_york_gc`, `london_es` — which is the name you will see in the journal,
  # the report and the per-session tables. Give a cell `name:` to choose your
  # own.
  #
  # Two cells on DIFFERENT instruments may share a window: each holds its own
  # position. Two on the SAME instrument may not, in any session — they would
  # fight over one position slot, and the config is rejected at load.
  #
  # `magic` is assigned automatically in declaration order and is stable across
  # runs, so a restart re-attaches to the same positions. Set it explicitly on
  # anything already trading live, because inserting a cell ABOVE it would
  # otherwise shift its number.
  #
  # The older flat form — one session naming one `instrument:` — still works
  # and is unchanged. Use it when a window only ever trades one symbol.
  # ------------------------------------------------------------------------

  new_york:
    enabled: false
    range_start: "09:30"          # New York open
    range_end:   "10:00"
    stop_time:   "16:55"          # flat before the 17:00 COMEX halt
                                  # NOT 17:00 — that is the exact moment COMEX
                                  # halts, so no tick arrives to trigger the
                                  # close and the position rides the 17:00-18:00
                                  # break (and the whole weekend on a Friday).
    instruments:
      gc:
        enabled: false
        lots: 1.0                 # ~$1,510 risk on a typical stop
        magic: 20260803  
      es:
        enabled: true            # ON once data/es_1m.parquet exists
        lots: 39               # ~$1,510 risk, to match gold
        magic: 20260804
        risk_reward: 2.0
        sl_mode: mid_range
        signal_timeframe: "M5"
        max_trades_per_session: 1
      nq:
        enabled: false            # ON once data/nq_1m.parquet exists
        lots: 10.91               # ~$1,510 risk, to match gold
        magic: 20260805

  london:
    enabled: false
    range_start: "03:00"          # London open
    range_end:   "03:30"
    stop_time:   "09:25"          # flat before New York opens
    instruments:
      gc:
        enabled: false
        lots: 1.0
        magic: 20260802
        risk_reward: 1.0
        signal_timeframe: "M1"
        max_trades_per_session: 0
      es:
        enabled: false
        lots: 39.48
        magic: 20260812
      nq:
        enabled: false
        lots: 10.91
        magic: 20260813

  asia:
    # Switch this on and run `--engine orb,orb_reverse` to trade Asia with the
    # breakout while London fades, on one account. Each session keeps the
    # engine of the file it is written in, so nothing is restated.
    enabled: true
    range_start: "19:00"          # Asia open
    range_end:   "19:30"
    stop_time:   "02:55"          # flat before London opens
    # engine: orb_reverse         # this whole row could fade instead
    # engine_options:
    #   sl_range_mult: 0.75
    #   direction: reverse
    instruments:
      gc:
        enabled: true
        lots: 1.0
        magic: 20260801
        risk_reward: 2.0
        sl_mode: mid_range
        signal_timeframe: "M1"
        max_trades_per_session: 2  
      es:
        enabled: false
        lots: 39.48
        magic: 20260822
      nq:
        enabled: true
        lots: 10
        magic: 20260823
        risk_reward: 2.0
        sl_mode: full_range
        signal_timeframe: "M15"
        max_trades_per_session: 0


# ===========================================================================
# 3  DEFAULTS  —  HOW to trade
# ===========================================================================
# The shared rule set. Every session inherits all of it, and any session may
# override any single option by repeating it in section 2.
#
# These are a 1:1 mirror of the MQL5 inputs — the strategy rules themselves are
# unchanged; this only says which values they run with.
defaults:

  # --- signal ---
  signal_timeframe: "M5"          # InpSignalTF — M1 M5 M15 M30 H1 H4 D1
                                  # the bar that must CLOSE beyond the range

  # --- risk ---
  sl_mode: mid_range              # InpSLMode: mid_range | full_range
                                  #   mid_range  — stop at the range midpoint
                                  #   full_range — stop at the opposite side
  risk_reward: 4.0                # InpRR — target = this x the stop distance
  lots: 1.0                       # InpLots

  # --- entries ---
  require_range_reentry: true     # InpRequireRangeReentry
                                  # true  — after a trade closes, price must
                                  #         close back INSIDE the range before
                                  #         the next breakout is taken
                                  # false — the very next candle closing
                                  #         outside the range opens a new trade
  pullback_entry: false           # InpPullbackEntry
                                  # false — enter as soon as a bar CLOSES
                                  #         outside the range (the original)
                                  # true  — do not enter on the breakout. Wait
                                  #         for price to come back and TOUCH
                                  #         the level it broke, and enter
                                  #         there:
                                  #           long  -> touch of the range HIGH
                                  #           short -> touch of the range LOW
                                  #
                                  # A touch is enough — the bar need not close
                                  # at the level — and the entry fires DURING
                                  # the bar that is still forming, not after it
                                  # closes.
                                  #
                                  # The stop and target are then measured from
                                  # the level, so `sl_mode` means the same
                                  # thing but the distances are usually
                                  # tighter than from a breakout fill.
                                  #
                                  # If price never comes back, the session
                                  # takes no trade. Nothing is carried into the
                                  # next session.
                                  #
                                  # Per session, and per instrument cell:
                                  #   new_york:
                                  #     pullback_entry: true
                                  #     instruments:
                                  #       gc: {}
                                  #       es: {pullback_entry: false}
                                  #
                                  # For one run only: --pullback / --no-pullback
                                  #
                                  # LIVE: the simulated broker fills exactly at
                                  # the level; a real one fills at its quote
                                  # when the touch is seen, which will usually
                                  # be a little worse. Size that in.
  breakeven: false                # InpBreakEven
                                  # false — the stop stays where it was placed
                                  #         for the life of the trade (the
                                  #         original behaviour)
                                  # true  — once the trade is far enough in
                                  #         front, move the stop to the ENTRY
                                  #         price. From there only a gap or
                                  #         slippage through the entry loses.
                                  #
                                  # "Far enough" is breakeven_trigger_r below,
                                  # measured in R — multiples of the risk THIS
                                  # trade was opened with. It fires at most once
                                  # per trade; the stop is never dragged again
                                  # behind price (that would be a trailing stop,
                                  # a different thing).
                                  #
                                  # The stop moves DURING the bar that reaches
                                  # the trigger, and that bar is then walked for
                                  # stops — so a bar that runs to the trigger
                                  # and comes back through the entry closes the
                                  # trade flat. A bar's four numbers cannot say
                                  # whether its high or its low came first, so
                                  # the worse order is assumed.
                                  #
                                  # Per session, and per instrument cell:
                                  #   london:
                                  #     breakeven: true
                                  #     instruments:
                                  #       gc: {}
                                  #       es: {breakeven: false}
                                  #
                                  # For one run only: --breakeven / --no-breakeven
  breakeven_trigger_r: 1.0        # InpBreakEvenTriggerR
                                  # How far in front the trade must be before
                                  # the stop moves to the entry, as a multiple
                                  # of its own risk. 1.0 is the 1:1 case: the
                                  # trade is up by exactly what it was risking.
                                  # Ignored unless breakeven is true.
                                  # For one run only: --breakeven-trigger
  max_trades_per_session: 0       # InpMaxTradesPerSession (0 = unlimited)
  close_at_stop_time: true        # InpCloseAtStopTime — flatten at stop_time.
                                  # Required when more than one session is on.

  # --- journal ---
  log_level: normal               # none | normal | verbose
  log_file: null                  # e.g. "backtest/orb/journal.log"
  log_show_time: true             # prefix each line with server time

  # --- identification ---
  # 202608xx, so it can never collide with the orb_reverse engine's 202609xx
  # in a merged run. Every session below sets its own; this is the fallback a
  # session inherits when it does not.
  magic: 20260800                 # InpMagic — tags this EA's orders in MT5
  comment: ""                     # InpComment — extra text after the tag
                                  #
                                  # Every order already carries a standard tag:
                                  #
                                  #     O | A | #2
                                  #     ^   ^    ^
                                  #     |   |    +-- trade number in the session
                                  #     |   +------- session: A sia, L ondon,
                                  #     |            N ew York (its first letter)
                                  #     +----------- strategy: O = breakout,
                                  #                  R = reverse
                                  #
                                  # Anything written here is appended AFTER the
                                  # tag, and trimmed first if MT5's 31-character
                                  # limit is reached — the tag is never cut, so
                                  # it stays readable and splits on `|`.
                                  # Leave it empty for the tag alone.

# ===========================================================================
# 4  NEWS DAYS
# ===========================================================================
# Calendar dates to avoid, or to trade exclusively.
#
# This is the SHARED news calendar — every session inherits it. A session can
# then treat it differently without repeating a single date (see section 2):
#
#   sessions:
#     asia:     { news_mode: "off" }   # skip these dates
#     new_york: { news_mode: "on"  }   # trade through them
#
# A session may also override one category at a time. Dates are always
# inherited; only the mode you restate changes.
#
# Each category has its own dates and its own mode:
#   on    - no restriction from this category (its dates are ignored)
#   off   - never trade this category's dates
#   only  - trade this category's dates and nothing else
#
# Matching is by CALENDAR DATE, never by day of the week. Listing 2026.01.13
# affects that one date only, not every Tuesday.
#
# Dates: single dates and from-to ranges, one per line or comma separated:
#   dates: |
#     2026.01.13
#     2026.03.10-2026.03.12
#
# HOW CATEGORIES COMBINE (only matters when you mix modes):
#   1. OFF IS FINAL. A day listed by ANY off category is never traded — full
#      stop. It does not matter if that same date also appears in an on
#      category, in an only category, or in the general bucket below. One off
#      listing ends the decision for that day.
#   2. If ANY category is set to only, a day must be listed by at least one of
#      them to be tradeable.
#   3. Otherwise the day is tradeable.
# A category with no dates can never match, so it restricts nothing.
news:

  core_cpi_mm:
    mode: "off"
    dates: |
      2026-01-13
      2026-02-13
      2026-03-11
      2026-04-10
      2026-05-12
      2026-06-10
      2026-07-14
      2026-08-12

  unemployment_rate:
    mode: "off"
    dates: |
      2026-01-09
      2026-02-11
      2026-03-06
      2026-04-03
      2026-05-08
      2026-06-05
      2026-07-02
      2026-08-07

  non_farm_employment_change:
    mode: "off"
    dates: |
      2026-01-09
      2026-02-11
      2026-03-06
      2026-04-03
      2026-05-08
      2026-06-05
      2026-07-02
      2026-08-07

  ism_manufacturing_pmi:
    mode: "off"
    dates: |
      2026-01-05
      2026-02-02
      2026-03-02
      2026-04-01
      2026-05-01
      2026-06-01
      2026-07-01
      2026-08-03

  core_pce_price_index_mm:
    mode: "off"
    dates: |
      2026-01-22
      2026-02-20
      2026-03-13
      2026-04-09
      2026-04-30
      2026-05-28
      2026-06-25
      2026-07-30

  federal_funds_rate:
    mode: "off"
    dates: |
      2026-01-28
      2026-03-18
      2026-04-29
      2026-06-17
      2026-07-29

  core_ppi_mm:
    mode: "off"
    dates: |
      2026-01-14
      2026-01-30
      2026-02-27
      2026-03-18
      2026-04-14
      2026-05-13
      2026-06-11
      2026-07-15
      2026-08-13

  ism_services_pmi:
    mode: "off"
    dates: |
      2026-01-07
      2026-02-04
      2026-03-04
      2026-04-06
      2026-05-05
      2026-06-03
      2026-07-06
      2026-08-05

# An extra un-categorised bucket. Behaves exactly like a ninth category:
# put any dates here and set news_trading to on / off / only.
news_days: ""
news_trading: "off"

# ===========================================================================
# 5  INSTRUMENT
# ===========================================================================
# Contract details used for price rounding and P&L maths.
# In LIVE mode these are read from MT5 and override whatever is written here.
symbol:
  name: "GC"                      # COMEX gold, 100 troy oz
  digits: 2
  point: 0.01
  tick_size: 0.10                 # GC minimum tick
  stops_level_points: 0           # SYMBOL_TRADE_STOPS_LEVEL
  volume_min: 1.0
  volume_max: 100.0
  volume_step: 1.0
  value_per_price_unit: 100.0     # money per 1.0 of price move per 1 lot
                                  #   GC 100  ($10 per 0.10 tick)
                                  #   ES 50 | NQ 20 | CL 1000
                                  #   EURUSD 1 standard lot = 100000
  currency: "USD"


# ===========================================================================
# 6  DATA
# ===========================================================================
databento:
  # --- CREDENTIALS ---------------------------------------------------------
  # The Databento API key is NOT in this file. It lives in `.env` at the
  # project root, which is git-ignored. See .env.example.
  dataset: "GLBX.MDP3"
  symbols: "GC.FUT"
  stype_in: "parent"              # raw_symbol | continuous | parent | instrument_id
  schema: "ohlcv-1m"              # base bar resolution fed to the engine

  # --- which contract to trade inside a multi-contract file ---
  # A parent file holds EVERY contract month plus every calendar spread.
  #   front_month_volume : per trading day, the highest-volume outright
  #                        contract; the roll only ever moves forward  <- default
  #   symbol             : one fixed contract, set contract_symbol below
  #   all                : no selection (single-instrument files only)
  contract_mode: "front_month_volume"
  contract_symbol: null           # e.g. "GCZ6" when contract_mode is "symbol"
  include_spreads: false          # keep GCG6-GCJ6 style spreads (you don't want to)
  roll_min_volume: 0              # ignore thin contracts when rolling

  # Hour (server time) the futures trading day starts on — the ONLY instant the
  # contract is allowed to change. 18 = the CME 18:00 New York open, so the
  # switch lands BETWEEN sessions. Setting this to 0 rolls at midnight, which
  # cuts through any session spanning midnight and injects the whole calendar
  # spread (+$33..+$60 on gold) as a price move that never happened.
  roll_boundary_hour: 18

  # --- used by download_data.py only ---
  start: "2024-01-01"
  end:   "2025-01-01"
  output_dir: "data"


# ===========================================================================
# 7  BACKTEST
# ===========================================================================
backtest:
  # The single merged bar file built by tools/merge_data.py.
  # Rebuild it after adding new data with:
  #   python tools/merge_data.py -d "data/gc_ohlcv1m_parent_*.dbn.zst" \
  #                              -o data/gc_1m_merged.parquet
  #
  # Do NOT point this at the "data" DIRECTORY: that would load the raw
  # .dbn.zst files AND the merged .parquet built from them — the same bars
  # twice. Name the file, or use an explicit glob.
  dbn_paths: "data/gc_1m_merged.parquet"

  initial_balance: 100000.0

  # --- fill assumptions ---
  # All three default to 0, so reported P&L is GROSS — no spread, slippage or
  # commission. Set them if you want net figures.
  spread_points: 0.0              # extra points paid on entry (ask - bid)
  slippage_points: 0.0            # applied against you on entry and on stops
  commission_per_lot_per_side: 0.0
  pessimistic_intrabar: true      # if SL and TP are both inside one bar, SL wins

  # --- output ---
  # null -> backtest/orb/<run-name>/, the standard layout every tool uses.
  # A literal path here overrides it for every run from this file; prefer
  # `--out somewhere` for a one-off.
  out_dir: null
  report_name: "orb_backtest_report"


# ===========================================================================
#  MetaTrader 5  (live execution only — ignored by the backtester)
# ===========================================================================
mt5:
  symbol: "GC"                    # the symbol name inside your MT5 terminal

  # --- CREDENTIALS ---------------------------------------------------------
  # Your MT5 login, password and server are NOT in this file. They live in
  # `.env` at the project root, which is git-ignored:
  #
  #     MT5_LOGIN=12345678
  #     MT5_PASSWORD=your-password
  #     MT5_SERVER=ICMarkets-Live12
  #     MT5_TERMINAL_PATH=C:/Program Files/MetaTrader 5/terminal64.exe
  #     DATABENTO_API_KEY=db-xxxxxxxx
  #
  # Copy `.env.example` to `.env` and fill it in. This config file is tracked
  # in git — anything written here is committed and pushed.

  deviation_points: 20            # max slippage allowed on a market order
  dry_run: true                   # true = log the order, do NOT send it

  # The signal is computed on the Databento instrument (CME GC) and executed on
  # the MT5 symbol above (spot XAUUSD). The two track each other but quote tens
  # of dollars apart, so a price LEVEL from the feed means nothing as an order
  # level on the broker - only the DISTANCES transfer.
  #   true  -> SL and TP are placed as distances measured from the REAL fill
  #            price, so risk is exactly what the signal asked for wherever the
  #            order happened to fill. Use this whenever the two symbols differ.
  #   false -> SL and TP are the feed's absolute levels. Correct ONLY when the
  #            MT5 symbol is the very instrument the bars came from.
  translate_levels: true

# ===========================================================================
# 8  PERIOD  —  backtest dates and output
# ===========================================================================
period:
  start: "2026-01-01"
  end:   "2026-08-13"

  # null -> the DATA block's dbn_paths above
  data: null

  # null -> backtest/orb/<run-name>/
  out_dir: null


# ===========================================================================
# 9  SWEEP  —  the lists tools/sweep.py combines
# ===========================================================================
# Every combination of every list is run. Check the count first:
#
#     python tools/sweep.py --engine orb --dry-run
sweep:
  sessions:        [ASIA, LONDON, NEW_YORK]
  timeframes:      [M1, M5, M15]
  orb_minutes:     [15, 30, 60]
  news:            [include, skip]
  risk_reward:     [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5]
  sl_modes:        [mid_range]
  # How many trades a session may take: 1 = R, 2 = RR, 3 = RRR, 0 = unlimited.
  # Turnover is what decides whether an instrument clears its own dealing
  # costs, so this axis is usually worth more than another R:R step.
  trade_caps:      [1, 2, 3, 0]
  # Break-even trigger, as a multiple of the trade's own risk. `off` disables
  # it. Keep `off` in the list: the question is whether moving the stop to the
  # entry helps at all, and only the same grid run both ways answers it.
  breakevens:      [off, 1.0, 1.5]

  out_dir: null                   # null -> backtest/orb/sweep/
  save_trades: false
